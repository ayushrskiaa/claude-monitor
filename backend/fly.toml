# fly.toml — Fly.io deployment config for claude-monitor backend
app = "claude-monitor-backend"   # change to your app name after `fly launch`
primary_region = "iad"

[build]

[env]
  PORT     = "8765"
  DATA_DIR = "/data"

[http_service]
  internal_port        = 8765
  force_https          = true
  auto_stop_machines   = false   # keep alive for WebSocket connections
  auto_start_machines  = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpus   = 1

[mounts]
  source      = "monitor_data"   # persistent volume for monitor.db
  destination = "/data"
